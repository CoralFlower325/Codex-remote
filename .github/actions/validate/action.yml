name: Validate source
description: Install the locked dependency graph and run the shared source checks.
inputs:
  build:
    description: Run the production build after typecheck and tests.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Typecheck
      run: npm run typecheck
      shell: bash
    - name: Unit and integration tests
      run: npm test
      shell: bash
    - name: Production build
      if: inputs.build == 'true'
      run: npm run build
      shell: bash
