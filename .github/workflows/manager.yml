name: Desktop Manager

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
          - os: macos-latest
            flags: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run manager:install
      - run: npm run manager:build
      - run: npm --prefix desktop run smoke
      - run: npm --prefix desktop run dist -- ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-smoke-${{ runner.os }}
          path: output/manager-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: manager-${{ runner.os }}
          path: |
            output/manager/*.exe
            output/manager/*.dmg
            output/manager/*.zip
      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(output/manager/*.exe output/manager/*.dmg output/manager/*.zip)
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
