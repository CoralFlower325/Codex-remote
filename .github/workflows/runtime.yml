name: Runtime Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm prune --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-runtime.mjs
      - run: npm run runtime:pack
      - name: Validate packaged runtime
        run: node scripts/verify-runtime-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ runner.os }}
          path: output/runtime/*
      - name: Attach runtime to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" output/runtime/*.tar.gz output/runtime/*.json --clobber
